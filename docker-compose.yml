# Karmic Kraken (kk) — karmic-kraken-beta-20261005 base + 3-diff patch chain, baked.
# Image: localhost/vllm-kk-patched:karmic-kraken-beta-20261005-4102660abd8a98b1,
#   built from ./Dockerfile.vllm-kk (compose `build:` runs automatically when
#   the image is absent; the in-image manifest.sha256 check ties the build to
#   the exact chain in files/vllm-kk/patches/kk/).
# Base: ghcr.io/local-inference-lab/vllm
#   @sha256:fd74019fc217a541060093d18427c36330df6ac5700651b55593dafdbb936920
#   (tag karmic-kraken-beta-20261005-4102660abd8a98b1; pins vllm@f1c2508f10,
#   b12x@52640cb15d).
# Chain: 008 -> 001 -> 005 (individual port.diffs; provenance in
#   files/vllm-kk/patches/kk/chain.txt). The 003 offload pack and the
#   aligned-retention gate fix are NOT here: merged/superseded upstream at
#   this base (lil/vllm PRs #869 + #870, commit 212f46bfa8). Keep
#   --recurrent-checkpoint-policy aligned below: the upstream gate accepts
#   aligned retention for connectors declaring supports_aligned_hybrid_transfer
#   at DCP==1 (OffloadingConnector does).
# KV connector: complex OffloadingConnector (VLLM_USE_SIMPLE_KV_OFFLOAD=0 +
#   explicit --kv-transfer-config) — serves CPU-tier prefix hits for the
#   align-mode Mamba + QSA hybrid, including restored recurrent state at
#   aligned boundaries.
# Launch: direct vllm serve + profile-env eval. The image's lil launcher
#   blocklists the OffloadingConnector flags, so the serve command is carried
#   here; the launcher's profile/hardware/common ENV layers are still consumed
#   verbatim via `eval $(python -m kk_profile_env)` (plugins/), which prints
#   the launcher's --print-config environment (JIT namespace
#   /cache/jit/<runtime-lock-sha>/<profile-id>, b12x/NCCL tuning, fastokens,
#   CUDA arch). Do not re-add those env vars here — they come from the image.
# Model: local-inference-lab/Qwen3.8-Flash-Next-NVFP4-MXFP8-CSF-QAD
#   (FP4-CSF QAD) @ revision ac1c8d8edfb88a41df837e8ca431e0ec237c139d,
#   resolved offline from ./files/models/vllm (HF cache). Served through the
#   FP4-CSF serving dir in files/vllm-kk/csf (metadata + rewritten
#   config.json; weights stay in the snapshot via checkpoint_root, which
#   assumes the snapshot lives at /models/vllm/models--local-inference-lab--
#   Qwen3.8-Flash-Next-NVFP4-MXFP8-CSF-QAD/snapshots/ac1c8d8.../).
#   --quantization/--load-format nvfp4_csf must match; moe-backend b12x, no
#   expert parallelism (image contract).
# Context: --max-model-len 524288 via YaRN --hf-overrides (factor 2.0 over
#   the checkpoint's 262144). max_position_embeddings must ALSO be raised to
#   524288 in the override (vLLM YaRN convention: the config carries the
#   scaled limit): the MTP draft derives its own max_model_len from it and
#   the b12x QSA binding limit comes from the DRAFT config — leaving 262144
#   fails CUDA-graph capture with "QSA sequence length 524288 exceeds the
#   configured limit 262144".
# KV sizing: --kv-cache-memory-bytes 17000000000 (15.83 GiB) measured
#   1,106,972 KV tokens / 2.11x concurrency @ 524,288 on a 96 GB RTX PRO
#   6000. 17.3G fails post-startup with CUDA OOM on the first real forward —
#   the pin must leave headroom for eager activation spikes, not just
#   profiling. Re-measure the "GPU KV cache size" line after any base bump
#   or checkpoint swap.
# Startup check: grep the log for "Setting attention block size to N
#   tokens"; N must divide --prefix-cache-retention-interval (3008 expected
#   on RTX PRO 6000 + b12x).
services:
  vllm-kk:
    build:
      context: .
      dockerfile: Dockerfile.vllm-kk
    image: localhost/vllm-kk-patched:karmic-kraken-beta-20261005-4102660abd8a98b1
    container_name: vllm-kk
    init: true
    security_opt:
      - seccomp=unconfined
    shm_size: 36g
    ulimits:
      memlock: -1
      stack: 67108864
    entrypoint: ["/bin/bash", "-lc"]
    environment:
      # Only what the image profile layers do NOT set. Everything else
      # (OMP/NCCL/B12X/VLLM_* tuning, JIT dirs) comes from kk_profile_env.
      - LLAMAKEY
      - PORT=8000
      - HF_HUB_CACHE=/models/vllm
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - VLLM_NO_USAGE_STATS=1
      - DO_NOT_TRACK=1
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
      - VLLM_USE_SIMPLE_KV_OFFLOAD=0
      - PYTHONPATH=/app/middleware:/app/plugins:/app/plugins/stats_logger
    devices:
      - "nvidia.com/gpu=all"
    volumes:
      - ./files/models:/models:ro
      - ./files/vllm-kk/csf:/models/csf:ro
      - ./files/vllm-kk/cache:/cache
      - ./files/vllm-kk/middleware:/app/middleware:ro
      - ./files/vllm-kk/plugins:/app/plugins:ro
    command:
      - >-
        eval "$(/opt/venv/bin/python -m kk_profile_env)";
        exec /opt/venv/bin/lil-runtime-bootstrap
        /opt/venv/bin/python -m vllm.entrypoints.cli.main serve
        /models/csf/Qwen3.8-Flash-Next-NVFP4-MXFP8-CSF-QAD-90e8eb0edd51
        --served-model-name qwen3.8-27b
        --api-key "$${LLAMAKEY}"
        --host 0.0.0.0
        --port "$${PORT}"
        --tensor-parallel-size 1
        --pipeline-parallel-size 1
        --prefix-cache-retention-interval 3008
        --mamba-cache-mode align
        --recurrent-checkpoint-policy aligned
        --mamba-ssm-cache-dtype auto
        --enable-prefix-caching
        --enable-chunked-prefill
        --async-scheduling
        --dtype bfloat16
        --kv-cache-dtype fp8
        --kv-cache-memory-bytes 17000000000
        --kv-offloading-size 35.6
        --enable-cumem-allocator
        --quantization nvfp4_csf
        --load-format nvfp4_csf
        --block-size 64
        --max-num-seqs 16
        --max-num-batched-tokens 6019
        --mm-encoder-tp-mode data
        --mm-processor-cache-gb 0
        --speculative-config '{"method":"mtp","num_speculative_tokens":3,"draft_sample_method":"probabilistic","rejection_sample_method":"standard","moe_backend":"b12x"}'
        --gdn-decode-kernel b12x
        --linear-backend b12x
        --moe-backend b12x
        --no-enable-flashinfer-autotune
        --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}'
        --max-cudagraph-capture-size 64
        --reasoning-parser qwen3_clean
        --reasoning-parser-plugin /app/plugins/qwen_clean_reasoning.py
        --tool-call-parser qwen3_xml
        --enable-auto-tool-choice
        --enable-prompt-tokens-details
        --chat-template /models/vllm/chat_template.jinja
        --middleware vllm_defaults.FrequencyPenaltyMiddleware
        --middleware vllm_middleware_strict_tool_calling.StrictToolCallingMiddleware
        --max-model-len 524288
        --hf-overrides '{"text_config":{"max_position_embeddings":524288,"rope_parameters":{"mrope_interleaved":true,"mrope_section":[11,11,10],"rope_type":"yarn","rope_theta":10000000,"partial_rotary_factor":0.25,"factor":2.0,"original_max_position_embeddings":262144}}}'
        --kv-transfer-config '{"kv_connector":"OffloadingConnector","kv_role":"kv_both"}'
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['PORT'] + '/health', timeout=4)"
      interval: 30s
      timeout: 5s
      start_period: 10m
      retries: 3
    restart: unless-stopped
